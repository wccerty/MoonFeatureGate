name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Moon env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.10.3 bash
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          command -v moon

      - name: Setup Moon env (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openssl
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.10.3 bash
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          command -v moon

      - name: Setup Moon env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          $env:MOONBIT_INSTALL_VERSION = "0.10.3"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          $moonBin = Join-Path $HOME ".moon\bin"
          $moonBin | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path = "$moonBin;$env:Path"
          & (Join-Path $moonBin "moon.exe") version --all

      - name: Setup MSYS2 + MinGW + openssl (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      - name: Moon Check
        run: |
          moon version --all
          moon fmt --check
          moon check --deny-warn
          moon check --deny-warn --target all
          moon info
          git diff --exit-code
          git status --short

      - name: Moon test
        run: |
          moon test --deny-warn --enable-coverage
          moon test --deny-warn --target all --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

          # ffi test
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
